[package]
name = "forage"
version = "0.1.0"
edition = "2021"
description = "An MCP server that gives Claude the ability to do deep research across the open web and social platforms"
license = "MIT"

[[bin]]
name = "forage"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client — using reqwest for now; swap to rquest when its crate stabilizes
# rquest (TLS impersonation) versions are all yanked as of 2026-05. reqwest is API-compatible.
reqwest = { version = "0.12", features = ["cookies", "rustls-tls", "json"], default-features = false }

# HTML to Markdown
htmd = "0.1"

# HTML parsing
scraper = "0.22"

# XML parsing (sitemaps)
quick-xml = { version = "0.37", features = ["serialize"] }

# MCP SDK
rmcp = { version = "0.1", features = ["server", "transport-io", "macros"] }
schemars = "0.8"

# SQLite cache
rusqlite = { version = "0.32", features = ["bundled"] }

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
url = "2"
thiserror = "2"
dirs = "6"
urlencoding = "2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
